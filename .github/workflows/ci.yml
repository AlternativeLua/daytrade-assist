name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            features: ""
          - os: macos-latest
            features: ""
          # The Linux build skips the native window, which would need WebKitGTK.
          - os: ubuntu-latest
            features: --no-default-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (unit + end-to-end against the built binary)
        run: cargo test --release ${{ matrix.features }}
      - name: Build
        run: cargo build --release ${{ matrix.features }}

  release:
    name: release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/release/daytrade-assist.exe "package/Daytrade Assist.exe"
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath DaytradeAssist-windows-x64.zip
      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos.sh
          ditto -c -k --keepParent "dist/Daytrade Assist.app" DaytradeAssist-macos-arm64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: DaytradeAssist-*.zip
          generate_release_notes: true
