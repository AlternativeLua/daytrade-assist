[package]
name = "daytrade-assist"
version = "0.6.0"
edition = "2024"

[features]
default = ["app"]
# Native window for `daytrade-assist app`; without it the UI opens in the browser.
app = ["dep:tao", "dep:wry"]

[dependencies]
tao = { version = "=0.37.1", optional = true }
wry = { version = "=0.57.0", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
